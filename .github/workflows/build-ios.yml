name: Build iOS (unsigned .ipa)

# Run it manually (Actions tab -> "Run workflow") or automatically
# when you push a version tag (e.g. v1.0.1).
# Produces an UNSIGNED .ipa: you then install it on your iPhone via
# a sideloading tool (AltStore, Sideloadly...). See README.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Required so the "Attach to release" step can write to the release.
permissions:
  contents: write

jobs:
  ios:
    # macos-15 ships Xcode 16, able to read the project generated by XcodeGen
    # (format 77). macos-14 (Xcode 15) fails with "future Xcode project format".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Copier l'app web dans les ressources
        run: |
          mkdir -p ios/Resources
          cp android/assets/index.html ios/Resources/index.html
          cp -r android/assets/fonts ios/Resources/fonts

      - name: Generate the Xcode project
        run: cd ios && xcodegen generate

      - name: Compiler (sans signature)
        run: |
          cd ios
          xcodebuild \
            -project TechCyberDaily.xcodeproj \
            -scheme TechCyberDaily \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Empaqueter en .ipa
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R TechCyberDaily.app Payload/
          zip -qr "$GITHUB_WORKSPACE/TechCyberDaily-unsigned.ipa" Payload

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: TechCyberDaily-iOS-unsigned
          path: TechCyberDaily-unsigned.ipa

      - name: Attach to release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TechCyberDaily-unsigned.ipa
