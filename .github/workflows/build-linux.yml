name: Build Linux (.AppImage)

# Run it manually (Actions tab -> "Run workflow") or automatically
# when you push a version tag (e.g. v1.0.1).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Required so the "Attach to release" step can write to the release.
permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file libfuse2

      - name: Build the AppImage
        run: |
          chmod +x linux/build_appimage.sh
          ./linux/build_appimage.sh

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechCyberDaily-AppImage
          path: linux/TechCyberDaily-x86_64.AppImage

      - name: Attach to release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: linux/TechCyberDaily-x86_64.AppImage
